[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-deconstruct"
version = "0.1.0"
description = "本地优先的中文网文拆书 CLI：文本 -> 章节切分 -> 结构化拆书产物（Markdown + JSONL），证据可追溯，模型可插拔"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "good-saltfish" }]
keywords = ["web-novel", "chinese", "writing", "deconstruction", "cli", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/good-saltfish/novel-deconstruct"
Repository = "https://github.com/good-saltfish/novel-deconstruct"
Issues = "https://github.com/good-saltfish/novel-deconstruct/issues"
Changelog = "https://github.com/good-saltfish/novel-deconstruct/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[project.scripts]
ndecon = "ndecon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ndecon.panel" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/ndecon"]
branch = true

[tool.ruff]
# 中文注释/字符串的全角字符按 2 列显示宽度计，取 120 作为中文项目务实行长
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/F 语法错误、I import 排序、UP 现代化语法、B 常见 bug、SIM 简化
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 测试中的长 fixture/断言以可读性优先，业界惯例
"tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer 的官方用法就是在默认参数中构造 Argument/Option，属 B008 已知误报
extend-immutable-calls = ["typer.Argument", "typer.Option"]
