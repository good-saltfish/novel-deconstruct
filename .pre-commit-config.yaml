# 本地 pre-commit：与 CI 的 ruff 检查保持一致（ADR 见经验：本地/CI 度量必须对齐）。
# 钩子全部 repo: local + language: system，直接调用本机已安装的 ruff，
# 不 clone GitHub，断网/SSH-only 环境也能 `pre-commit install` 后正常使用。
# 大文件与冲突标记由 CI 的 repo hygiene job 兜底。
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, pinned by local install)
        entry: ruff check
        language: system
        types_or: [python, pyi]
