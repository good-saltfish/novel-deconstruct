name: Release

# 触发方式：
# 1) 推送 v* 标签 -> 构建并发布到 PyPI（要求已在 PyPI 项目配置 GitHub OIDC trusted publisher）
# 2) 手动 workflow_dispatch -> 默认只构建不发布，用于发布前演练
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "勾选才发布到 PyPI；默认仅构建验证（dist 制品仍可下载检查）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Inspect packaged contents
        run: |
          # wheel 必须含入口模块；sdist/wheel 必须带许可证
          python - <<'PY'
          import zipfile, glob, sys, tarfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
          assert any(n.endswith("ndecon/cli.py") for n in names), "wheel 缺少 ndecon/cli.py"
          assert any(n.endswith("LICENSE") for n in names), "wheel 缺少 LICENSE"
          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as t:
              members = t.getnames()
          assert any(m.endswith("LICENSE") for m in members), "sdist 缺少 LICENSE"
          assert any(m.endswith("pyproject.toml") for m in members), "sdist 缺少 pyproject.toml"
          print("package content OK:", wheel, sdist)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI + GitHub Release
    needs: build
    # tag 推送必发布；手动运行只有勾选 publish 才发布
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing（OIDC），不存储任何 API token
      contents: write   # 创建 GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      # PyPI 走 trusted publishing：仓库上必须先配好 OIDC 信任关系（PyPI 网页 →
      # Publishing → GitHub），否则这一步必然失败。用一个仓库变量当开关，
      # 让「代码已发、PyPI 还没配」这种中间状态也能出一个正常的 Release，
      # 而不是让每次发版都挂一个大红叉。
      # 配好之后执行 `gh variable set PYPI_READY -b true` 即可自动发布。
      - name: PyPI trusted publisher 未配置时跳过发布
        if: vars.PYPI_READY != 'true'
        run: |
          echo "::warning::跳过 PyPI 发布：仓库变量 PYPI_READY 不是 true。"
          echo "配好 PyPI trusted publisher 后执行：gh variable set PYPI_READY -b true"
      - name: Publish to PyPI
        if: vars.PYPI_READY == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 另存一份不带版本号的 wheel：插件的兜底安装路径要用
          # releases/latest/download/<固定名>，带版本号的文件名一下个版本就 404。
          WHEEL=$(ls dist/*.whl)
          cp "$WHEEL" dist/novel-deconstruct-py3-none-any.whl
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
